; GENIbus master on STM32F103C8 (Blue Pill) - see README.md
;
;   pio run               build
;   pio run -t upload     flash (ST-Link)
;   pio device monitor    JSON output + CLI on USART1 @115200
;   make -C test/host     portable protocol unit tests on the host

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
; main.cpp is the old Arduino template and is not part of this firmware.
build_src_filter = +<*> -<main.cpp>
build_flags = -Iinclude
build_src_flags = -Wall -Wextra -Werror
